name: smoke
seed: 42

paths:
  raw: data/raw
  interim: data/interim/smoke

data:
  dataset: Hello-SimpleAI/HC3
  revision: 4d0ff18143b5a7e1b1e79beb540c04549d1e59d3
  n_texts: 5
  min_words: 50
  max_words: 150

detector:
  model: hf-internal-testing/tiny-random-RobertaForSequenceClassification
  device: cpu

transforms:
  synonyms:
    fraction: 0.1
  backtranslation:
    forward_model: Helsinki-NLP/opus-mt-en-de
    backward_model: Helsinki-NLP/opus-mt-de-en
    batch_size: 16
    device: cpu
    generate:
      num_beams: 4
  paraphrase:
    model: humarin/chatgpt_paraphraser_on_T5_base
    prefix: "paraphrase: "
    batch_size: 16
    device: cpu
    generate:
      num_beams: 5
      repetition_penalty: 10.0
      no_repeat_ngram_size: 2

filter:
  min_length_ratio: 0.7
  max_length_ratio: 1.3
  sbert_model: sentence-transformers/all-mpnet-base-v2
  min_similarity: 0.85
  device: cpu

explainers:
  ig:
    n_steps: 5

metrics:
  top_k_fraction: 0.1
