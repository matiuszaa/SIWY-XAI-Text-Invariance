name: prototype
seed: 42

paths:
  raw: data/raw
  interim: data/interim/prototype

data:
  dataset: Hello-SimpleAI/HC3
  revision: 4d0ff18143b5a7e1b1e79beb540c04549d1e59d3
  n_texts: 20
  min_words: 50
  max_words: 150

detector:
  model: Hello-SimpleAI/chatgpt-detector-roberta
  device: cuda

transforms:
  synonyms:
    fraction: 0.1

filter:
  min_length_ratio: 0.7
  max_length_ratio: 1.3
  sbert_model: sentence-transformers/all-mpnet-base-v2
  min_similarity: 0.85
  device: cuda

review:
  n_pairs: 30
  thresholds: [0.75, 0.8, 0.85, 0.9, 0.95]

explainers:
  ig:
    n_steps: 50
  lime:
    n_samples: 1000
    seed: 42
  shap:
    max_evals: 500
    seed: 42

alignment:
  model: google-bert/bert-base-multilingual-cased
  method: itermax
  device: cuda

metrics:
  top_k_fraction: 0.1

wandb:
  project: siwy-xai-text-invariance
  mode: online
